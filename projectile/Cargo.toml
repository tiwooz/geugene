# ProjectIle is a standalone app: its own Cargo workspace, version and lockfile. It is not a member
# of the PhotoCraft workspace and PhotoCraft never builds or launches it. It reads a PhotoCraft
# source folder chosen at run time and generates PhotoCore projects from it.
[workspace]

[package]
name = "projectile"
description = "ProjectIle: standalone native generator for PhotoCore projects from a PhotoCraft source tree"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence", "accesskit"] }
rfd = "0.17"
arboard = { version = "3.6", features = ["wayland-data-control"] }
open = "5"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
